name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Unit + integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # FINAL-QA-REPORT D-02: the production entry point must actually start
      # (node dist/server.js, NODE_ENV=production) and answer /health and /ready.
      - name: Production start check
        run: pnpm --filter @haven/api run check:prod-start

      # Database guarantees (SDD §19.1 "Database: pgTAP via supabase test db"): the real
      # Supabase Postgres with every migration applied, then supabase/tests/*.sql.
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase database
        run: supabase db start
      - name: pgTAP tests
        run: supabase test db

      # SDD §19.1 / DEVELOPMENT.md: Playwright on PRs to main. Fresh E2E database, the
      # E2E API (frozen clock) and the Expo web app, then the whole suite.
      - name: Install Playwright Chromium
        if: github.event_name == 'pull_request'
        run: pnpm --filter @haven/mobile exec playwright install --with-deps chromium
      - name: Playwright E2E
        if: github.event_name == 'pull_request'
        run: pnpm e2e
      - name: Upload Playwright results
        if: failure() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            apps/mobile/test-results
            apps/mobile/e2e-logs
          retention-days: 7

      # Production dependencies only; the two GHSAs ignored in package.json's
      # pnpm.auditConfig are in Expo's build toolchain with no patched release (DEC-024).
      - name: Dependency audit (high severity fails the build)
        run: pnpm audit --prod --audit-level high
